<!DOCTYPE html>

    <style>
        *{
    margin: 0;
    padding: 0;
}
.heading{
    font-size: 70px;
}
.heading_box{
    margin: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
    width: 500px;
    border: 10px solid black;
}
body::-webkit-scrollbar {
display: none;
}
.navbar{
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: grey;
    height: 80px;
    width: 100%;
    margin-top: 20px;
    margin-bottom: 20px;
}
.navbar a{
    text-decoration: none;
}
.navbar h3{
    height: 40px;
    width: 150px;
    border: 2px solid black;
    background-color: black;

    border-radius: 50px;

.main{

    display: inline-block;

    width: 40%;

    height: 500px;
    width: 350px;
    position: absolute;
    top: 50px;
    left: 120px;
}

.Profile_text{
    position: absolute;
    right: 8%;
    bottom: 35%;
}

.small-text{
    font-family: "Poppins", sans-serif;
    font-size: 35px;
    font-weight: 700;
    color: #000;
    line-height: 1.2;
    margin-bottom: 50px;
}

.name{
    font-family: "Poppins", sans-serif;
    font-size: 78px;
    font-weight: 650;
    color: #000;
    line-height: 1;
    letter-spacing: -2px;
    margin: 0;
}

.role{
    font-family: "Poppins", sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: #8a8a8a;
    line-height: 1.4;
    margin-top: 10px;

footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 20px;
   }

    <header>
